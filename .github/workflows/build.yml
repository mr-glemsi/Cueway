name: Build and Package Cueway

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cueway (Native AOT x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT binary
        run: |
          dotnet publish Cueway.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "bin\Release\net10.0-windows10.0.22621.0\win-x64\publish\Cueway.exe")) {
            throw "Expected published Cueway.exe not found."
          }

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: cueway-app-unsigned
          path: bin/Release/net10.0-windows10.0.22621.0/win-x64/publish/Cueway.exe
          if-no-files-found: error

      - name: Install Inno Setup 7
        run: |
          $installer = Join-Path $env:TEMP "innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/ALLUSERS" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($proc.ExitCode)" }
          $iscc = @(
            "C:\Program Files\Inno Setup 7\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe for Inno Setup 7 not found after installation." }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Inno Setup installer
        run: |
          $issArgs = @("/Q")
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
            $issArgs += "/DMyAppVersion=$tagVersion"
          }
          $issArgs += "Cueway.iss"
          & $env:ISCC_PATH @issArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "SetupOutput\Cueway-Setup-x64.exe")) {
            throw "Expected SetupOutput\Cueway-Setup-x64.exe not found."
          }

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cueway-installer-unsigned
          path: SetupOutput/Cueway-Setup-x64.exe
          if-no-files-found: error
