<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cueway</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 14px;
      width: 310px;
      background: #0E1117;
      color: #F3F4F6;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .brand img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: #161B22;
      border: 1px solid #262D38;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
    }
    .pill.ok {
      border-color: rgba(34, 197, 94, 0.45);
      color: #22C55E;
      background: rgba(34, 197, 94, 0.12);
    }
    .pill.ok .dot {
      background: #22C55E;
    }
    .meta {
      color: #9CA3AF;
      font-size: 11px;
      margin-bottom: 10px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .tab-row {
      background: #161B22;
      border: 1px solid #262D38;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-info {
      min-width: 0;
      flex: 1;
    }
    .tab-title {
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-sub {
      color: #9CA3AF;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      background: #161B22;
      border: 1px dashed #262D38;
      border-radius: 8px;
      padding: 12px;
      color: #9CA3AF;
      font-size: 12px;
      text-align: center;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      border: 1px solid #3B82F6;
      background: #3B82F6;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #2563EB;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon48.png" alt="Cueway" />
      <span>Cueway</span>
    </div>
    <span id="connPill" class="pill"><span class="dot"></span><span id="connText">Offline</span></span>
  </div>
  <div class="meta" id="browserMeta">Browser: -</div>
  <div id="tabList" class="list"></div>
  <button id="btnReconnect" type="button">Reconnect &amp; Rescan Tabs</button>
  <script src="popup.js"></script>
</body>
</html>
